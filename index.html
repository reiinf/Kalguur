<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Картоходец — переезд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0b08;
    --bg2: #141210;
    --gold: #c8a96e;
    --gold-d: #8a6d3b;
    --txt: #d4c9b0;
    --txt-d: #7a6e5a;
    --brd: #2a2418;
    --red: #cc4444;
    --grn: #55aa55;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--txt);
    font-family: 'Crimson Text', Georgia, serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* Subtle background texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200,169,110,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 20% 80%, rgba(100,60,20,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--bg2);
    border: 1px solid var(--brd);
    max-width: 520px;
    width: 100%;
    padding: 36px 32px 28px;
    /* PoE-style diagonal clip */
    clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-d), var(--gold), var(--gold-d), transparent);
  }

  .title {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 6px;
    text-align: center;
  }

  .subtitle {
    font-size: 15px;
    color: var(--txt-d);
    text-align: center;
    margin-bottom: 28px;
    font-style: italic;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--brd);
    margin: 20px 0;
  }

  .save-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--txt-d);
    margin-bottom: 6px;
  }

  #save-section { margin-top: 20px; }

  .save-box {
    width: 100%;
    height: 76px;
    background: #080706;
    border: 1px solid var(--brd);
    color: var(--gold);
    font-size: 10px;
    font-family: monospace;
    padding: 8px;
    resize: none;
    border-radius: 1px;
    line-height: 1.4;
    opacity: 0.85;
  }
  .save-box:focus { outline: none; border-color: var(--gold-d); }

  .copy-hint {
    font-size: 12px;
    color: var(--txt-d);
    margin-top: 5px;
    font-style: italic;
  }

  /* Button */
  .btn-go {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: linear-gradient(180deg, rgba(200,169,110,0.18), rgba(200,169,110,0.06));
    border: 1px solid var(--gold-d);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 2px;
    cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
    transition: background 0.2s, border-color 0.2s;
    text-decoration: none;
    text-align: center;
  }
  .btn-go:hover:not(:disabled) {
    background: linear-gradient(180deg, rgba(200,169,110,0.28), rgba(200,169,110,0.10));
    border-color: var(--gold);
  }
  .btn-go:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .no-save-note {
    font-size: 13px;
    color: var(--txt-d);
    text-align: center;
    font-style: italic;
    margin-top: 16px;
  }

  #iframe-container { display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="title">⚔ КАРТОХОДЕЦ ПЕРЕЕХАЛ</div>
  <div class="subtitle">Игра доступна по новому адресу</div>

  <div id="save-section" style="display:none">
    <div class="save-label">КОД ВАШЕГО СОХРАНЕНИЯ</div>
    <textarea class="save-box" id="save-code" readonly></textarea>
    <div class="copy-hint">Если что-то пошло не так — скопируйте код и вставьте в игре через «Импорт сохранения»</div>
  </div>

  <button class="btn-go" id="btn-transfer" style="display:none">💾 ПЕРЕНЕСТИ СОХРАНЕНИЕ</button>
  <button class="btn-go" id="btn-go" style="margin-top:10px">⚔ ПЕРЕЙТИ В ИГРУ</button>
</div>

<script>
const NEW_DOMAIN = 'https://cartographer-idle.vercel.app';
const SAVE_KEY = 'kartahodec_save';
const SETTINGS_KEYS = ['kalguur_lang', 'kalguur_volume', 'kalguur_fontOffset'];

const _SAVE_KEY_XOR = [75,97,108,103,117,117,114,95,50,48,50,52,95,115,97,118,101];
function _obfuscate(str) {
  const bytes = new TextEncoder().encode(str);
  const out = new Uint8Array(bytes.length);
  for (let i = 0; i < bytes.length; i++) out[i] = bytes[i] ^ _SAVE_KEY_XOR[i % _SAVE_KEY_XOR.length];
  let bin = '';
  for (let i = 0; i < out.length; i++) bin += String.fromCharCode(out[i]);
  return btoa(bin);
}

function getRawSave() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw || raw === 'reset') return null;
  try {
    const obj = JSON.parse(raw);
    delete obj._icons;
    return JSON.stringify(obj);
  } catch(e) { return null; }
}

function getSettings() {
  const s = {};
  SETTINGS_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v !== null) s[k] = v; });
  return s;
}

// ── Init ────────────────────────────────────────────────

const rawSave = getRawSave();
const btnGo = document.getElementById('btn-go');
const btnTransfer = document.getElementById('btn-transfer');

btnGo.onclick = () => { window.open(NEW_DOMAIN, '_blank'); };

if (rawSave) {
  // Показываем код сейва
  const section = document.getElementById('save-section');
  const ta = document.getElementById('save-code');
  try { ta.value = _obfuscate(rawSave); } catch(e) { ta.value = rawSave; }
  section.style.display = 'block';

  // Показываем кнопку переноса
  btnTransfer.style.display = 'block';

  btnTransfer.onclick = () => {
    // Кодируем сейв и настройки прямо в hash URL — никаких postMessage/opener
    const settings = getSettings();
    const payload = rawSave + '|' + JSON.stringify(settings);
    const hash = '#kalguur:' + encodeURIComponent(payload);
    window.open(NEW_DOMAIN + '/' + hash, '_blank');
    btnTransfer.textContent = '✅ Открыта новая вкладка с вашим сохранением';
    btnTransfer.style.borderColor = '#55aa55';
    btnTransfer.style.color = '#55aa55';
    btnTransfer.disabled = true;
  };
}
</script>
</body>
</html>
